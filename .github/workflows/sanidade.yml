name: Sanidade

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar stack
        id: stack
        run: |
          if [ -f pyproject.toml ] || [ -f setup.py ]; then echo "tipo=python" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ]; then echo "tipo=node" >> "$GITHUB_OUTPUT"
          elif ls *.html >/dev/null 2>&1; then echo "tipo=html" >> "$GITHUB_OUTPUT"
          else echo "tipo=nenhum" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.stack.outputs.tipo == 'python'
        with:
          python-version: "3.12"

      - name: Python, testes se existirem
        if: steps.stack.outputs.tipo == 'python'
        run: |
          python -m pip install -q --upgrade pip
          if [ -f requirements.txt ]; then pip install -q -r requirements.txt; fi
          pip install -q -e . 2>/dev/null || true
          if ls test_*.py tests/test_*.py >/dev/null 2>&1; then
            python -m unittest discover -v
          else
            echo "sem testes ainda: portao passa declarando ausencia"
          fi

      - uses: actions/setup-node@v4
        if: steps.stack.outputs.tipo == 'node'
        with:
          node-version: "20"

      - name: Node, instala e testa se houver teste
        if: steps.stack.outputs.tipo == 'node'
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --silent || npm install --legacy-peer-deps --silent
          else
            npm install --legacy-peer-deps --silent
          fi
          if [ ! -d src ]; then
            echo "::warning::sem pasta src/: package.json existe mas o app nao"
            exit 0
          fi
          if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.test ? 0 : 1)"; then
            CI=true npm test -- --watchAll=false --passWithNoTests
          else
            echo "sem script de teste: portao passa declarando ausencia"
          fi

      - name: HTML estatico
        if: steps.stack.outputs.tipo == 'html'
        run: echo "site estatico, sem build"
